# Render Blueprint for the Ozu game server (WebSockets supported).
# Deploy: https://render.com/deploy?repo=https://github.com/teetoh861/ozu-
services:
  - type: web
    name: ozu-game-server
    runtime: docker
    dockerfilePath: ./apps/server/Dockerfile
    dockerContext: .
    # Free plan: sleeps after ~15 min with no players and takes ~1 min to wake.
    # Upgrade to `starter` for always-on hosting before a public launch.
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: GUEST_TOKEN_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://ozu.vercel.app
      # Required on the free plan (no persistent disk): Supabase Postgres connection string.
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
